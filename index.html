<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Studio - Sync Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       GLOBAL STYLES
    ========================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* =========================================
       MAIN CARD
    ========================================== */
    .card {
      width: 100%;
      max-width: 420px;
      background: #212121;
      border: 1px solid #3d3d3d;
      border-radius: 12px;
      padding: 22px;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.03);
    }

    /* =========================================
       HEADER
    ========================================== */
    .studio-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
    }

    .studio-header span {
      color: #b3b3b3;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .yt-logo {
      width: 32px;
      height: 22px;
      flex-shrink: 0;
    }

    /* =========================================
       CONTENT
    ========================================== */
    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .description {
      color: #aaaaaa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* =========================================
       PROFILE ROW
    ========================================== */
    .profile-row {
      display: flex;
      align-items: center;
      margin-bottom: 22px;
    }

    .profile-image {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3d3d3d;
      margin-right: 14px;
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channel-name {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
    }

    .verified-badge {
      width: 18px;
      height: 18px;
      fill: #3ea6ff;
    }

    /* =========================================
       PROGRESS BAR
    ========================================== */
    .progress-wrapper {
      margin-bottom: 12px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #333333;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #cc0000;
      border-radius: 999px;
      transition: width 1.4s ease;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      color: #b3b3b3;
      font-size: 13px;
    }

    /* =========================================
       BUTTONS
    ========================================== */
    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border-radius: 999px;
      transition: 0.2s ease;
      padding: 11px 18px;
    }

    .btn-dismiss {
      background: transparent;
      color: #b3b3b3;
    }

    .btn-dismiss:hover {
      background: rgba(255,255,255,0.05);
    }

    .btn-primary {
      background: #3ea6ff;
      color: #0f0f0f;
      font-weight: 700;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* =========================================
       MOBILE OPTIMIZATION
    ========================================== */
    @media (max-width: 480px) {
      .card {
        padding: 20px;
      }

      .title {
        font-size: 22px;
      }

      .description {
        font-size: 13px;
      }

      .actions {
        gap: 8px;
      }

      .btn {
        padding: 10px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="studio-header">
      <svg class="yt-logo" viewBox="0 0 90 60" xmlns="http://www.w3.org/2000/svg">
        <rect width="90" height="60" rx="14" fill="#FF0000"/>
        <polygon points="38,18 38,42 58,30" fill="white"/>
      </svg>
      <span>YouTube Studio</span>
    </div>

    <h1 class="title">Be a Member..!</h1>

    <p class="description">
      Verify your account connection status to sync with the creator network..!
    </p>

    <div class="profile-row">
      <img
        class="profile-image"
        src="https://unavatar.io/youtube/MuloTheGamer"
        alt="Glaxiblade Profile"
      />

      <div class="profile-info">
        <div class="channel-name">Mulo The Gamer</div>

        <svg class="verified-badge" viewBox="0 0 24 24">
          <path d="M12 2L14.39 4.42L17.76 3.64L18.54 7.01L21 9.4L19.78 12L21 14.6L18.54 16.99L17.76 20.36L14.39 19.58L12 22L9.61 19.58L6.24 20.36L5.46 16.99L3 14.6L4.22 12L3 9.4L5.46 7.01L6.24 3.64L9.61 4.42L12 2ZM10.6 15.2L17 8.8L15.6 7.4L10.6 12.4L8.4 10.2L7 11.6L10.6 15.2Z"/>
        </svg>
      </div>
    </div>

    <div class="progress-wrapper">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="progress-labels">
        <span id="subscriberLabel">Loading stats...</span>
        <span id="percentageLabel">--%</span>
      </div>
    </div>

    

    <div class="actions">

<button class="btn btn-dismiss">

Dismiss

</button>

<button class="btn btn-primary" id="verifyBtn">
Verify & Subscribe
</button>
      
    <a href="https://github.com/glax106" 
   target="_blank" 
   style="text-decoration: none; display: flex; align-items: center; justify-content: center; background-color: #007bff; color: #ffffff; font-weight: bold; padding: 12px; border-radius: 50px; font-size: 14px; border: none; cursor: pointer; text-align: center; width: 100%; margin-top: 12px; box-sizing: border-box; transition: background 0.2s;">
   ❤️ Support Developer
    </a>
        
    </div>
    </div>
      
    

</div>
    
  </div>

  <script>
    /* =========================================
       GOOGLE SHEETS CONFIGURATION
    ========================================== */

    // Live Sheet ID has been injected below successfully
    const SHEET_ID = "1yzqEB9_x-vWGD6_-wvk7h8fF0wd1yVnjzHKVKZt8ang";

    // Google Sheets CSV Export URL
    const CSV_URL =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    /* =========================================
       DOM ELEMENTS
    ========================================== */
    const progressFill = document.getElementById("progressFill");
    const subscriberLabel = document.getElementById("subscriberLabel");
    const percentageLabel = document.getElementById("percentageLabel");
    const verifyBtn = document.getElementById("verifyBtn");
    const dismissBtn = document.querySelector(".btn-dismiss");

    /* =========================================
       FORMAT NUMBER FUNCTION
    ========================================== */
    function formatSubscribers(num) {
      if (num >= 1000000) {
        return (num / 1000000).toFixed(2).replace(/\.00$/, '') + 'M';
      }

      if (num >= 1000) {
        return (num / 1000).toFixed(2).replace(/\.00$/, '') + 'K';
      }

      return num.toString();
    }

    /* =========================================
       FETCH GOOGLE SHEETS CSV DATA
    ========================================== */
    async function loadSubscriberData() {
      try {
        // Fetch CSV text
        const response = await fetch(CSV_URL);

        // Convert response to plain text
        const csvText = await response.text();

        // Split rows
        const rows = csvText.trim().split("\n");

        // Get first row
        const firstRow = rows[0];

        // Split columns
        const columns = firstRow.split(",");

        // Clean formatting quotes and formatting commas out of cells before parsing
        const currentSubscribers = parseInt(columns[0].replace(/["']/g, "").replace(/,/g, "").trim(), 10);
        const targetSubscribers = parseInt(columns[1].replace(/["']/g, "").replace(/,/g, "").trim(), 10);

        // Prevent invalid data parsing crashes
        if (
          isNaN(currentSubscribers) ||
          isNaN(targetSubscribers) ||
          targetSubscribers <= 0
        ) {
          throw new Error("Invalid spreadsheet values.");
        }

        // Calculate percentage
        const percentage = (currentSubscribers / targetSubscribers) * 100;

        // Update labels dynamically using the formatter
        subscriberLabel.textContent =
          `${formatSubscribers(currentSubscribers)} / ${formatSubscribers(targetSubscribers)} Subscribers`;

        percentageLabel.textContent =
          `${percentage.toFixed(1)}%`;

        // Animate progress bar smoothly
        setTimeout(() => {
          progressFill.style.width =
            `${Math.min(percentage, 100)}%`;
        }, 250);

      } catch (error) {
        console.error("Failed to load spreadsheet data:", error);

        // Fallback UI handling
        subscriberLabel.textContent = "Unable to sync subscriber metrics";
        percentageLabel.textContent = "--%";
        return;
      }
    }

    /* =========================================
       BUTTON CLICK ROUTING
    ========================================== */
    verifyBtn.addEventListener("click", () => {
      // Redirect to YouTube auto-subscribe module
      window.location.href =
        "https://www.youtube.com/@MuloTheGamer?sub_confirmation=1";
    });

    dismissBtn.addEventListener("click", () => {
      // Sandboxed alternative to window.close() for mobile QR users
      window.location.href = "https://www.youtube.com";
    });

    /* =========================================
       INITIALIZE INTERFACE
    ========================================== */
    window.addEventListener("DOMContentLoaded", () => {
      loadSubscriberData();
    });

  </script>
  
</body>
</html>
